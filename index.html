<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf4"><title>My Recipe</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#292821;background:#fffaf4}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#fffaf4ee;backdrop-filter:blur(12px);padding:22px 18px 12px;z-index:5;border-bottom:1px solid #eee4d7}.wrap{max-width:760px;margin:auto}h1{font-size:27px;margin:0 0 5px}small,.muted{color:#81796f}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.button,button{border:0;border-radius:13px;background:#a44830;color:white;font-weight:700;padding:11px 16px;font-size:15px;cursor:pointer}.secondary{background:#eee6db;color:#483c34}.danger{background:#a32c31}.small{font-size:13px;padding:8px 11px}.search{width:100%;border:1px solid #dfd2c3;background:white;padding:14px;border-radius:14px;font-size:16px;margin-top:16px}main{padding:18px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.tile{border:1px solid #eee1d5;border-radius:17px;overflow:hidden;background:white;cursor:pointer;text-align:left;color:#302a25;padding:0}.tile img,.placeholder{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f0e3d3;display:grid;place-items:center;font-size:35px}.tile .body{padding:11px}.tile .name{font-size:16px;font-weight:750;line-height:1.45}.tile .tags{color:#8b786b;font-size:12px;margin-top:5px;line-height:1.4}.empty{text-align:center;padding:65px 12px;color:#75675c}.screen{display:none}.screen.active{display:block}label{font-size:14px;font-weight:700;display:block;margin:15px 0 6px}input[type=text],input[type=number],textarea{width:100%;font:inherit;padding:12px;border:1px solid #d9cbbd;border-radius:12px;background:white;font-size:16px}textarea{min-height:85px;resize:vertical}.ingredient{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 40px;gap:7px;margin:8px 0}.ingredient button{padding:4px;background:#eee6db;color:#7b5041}.panel{background:white;border:1px solid #efe1d3;border-radius:16px;padding:16px;margin:14px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}.preview{max-width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-top:10px}.detail-photo{width:100%;max-height:350px;object-fit:cover;border-radius:16px}.steps{white-space:pre-wrap;line-height:1.8}.line{padding:9px 0;border-bottom:1px solid #f2e9df}.line:last-child{border-bottom:0}.title2{font-size:26px;margin:15px 0 4px}.hint{font-size:12px;color:#8c7e72;line-height:1.6}.footer{margin:25px 0 60px;color:#988b7b;font-size:12px}.star{font-size:22px;background:transparent;color:#ab6640;padding:4px 8px}input[type=file]{width:100%;font-size:14px}.notice{font-size:13px;background:#f4e8d7;border-radius:10px;padding:11px;line-height:1.6}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #c68569} </style></head><body>
<header><div class="wrap"><div class="top"><div><h1>🍳 My Recipe</h1><small>お気に入りの味を、いつでも。</small></div><button id="newTop">＋ 追加</button></div><input id="search" class="search" placeholder="🔎 料理名・材料名から探す" aria-label="レシピを検索"></div></header>
<main class="wrap"><section id="listScreen" class="screen active"><div class="tools"><button id="allBtn" class="secondary small">すべて</button><button id="favBtn" class="secondary small">★ お気に入り</button><button id="exportBtn" class="secondary small">↓ バックアップ</button><button id="importBtn" class="secondary small">↑ 復元</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><p id="count" class="muted"></p><div id="cards" class="grid"></div><div id="empty" class="empty" hidden>まだレシピがありません。<br>右上の「＋ 追加」で登録してみよう！</div><div class="footer">※ この試作版のデータは、このブラウザ内に保存されます。定期的にバックアップしてください。端末間の自動同期はありません。</div></section>
<section id="editScreen" class="screen"><button id="backEdit" class="secondary small">← 戻る</button><h2 id="formTitle">レシピを追加</h2><form id="recipeForm"><label for="name">料理名 *</label><input type="text" id="name" required placeholder="例：鶏の照り焼き"><label for="photo">完成写真</label><input type="file" id="photo" accept="image/*"><img id="preview" class="preview" alt="写真プレビュー" hidden><div class="actions"><button type="button" id="removePhoto" class="secondary small" hidden>写真を削除</button></div><label>材料・分量</label><div id="ingredients"></div><button type="button" id="addIngredient" class="secondary small">＋ 材料を追加</button><label for="steps">調理方法</label><textarea id="steps" placeholder="1. 材料を切る&#10;2. フライパンで焼く&#10;3. 味付けをする"></textarea><label for="memo">メモ（任意）</label><textarea id="memo" placeholder="コツ、調理時間、人数など"></textarea><div class="actions"><button type="submit" id="saveBtn">保存する</button><button type="button" id="cancel" class="secondary">キャンセル</button></div></form><p class="hint">写真は保存容量を抑えるため自動縮小します。保存できない場合は写真を減らすか、バックアップしてください。</p></section>
<section id="detailScreen" class="screen"><button id="backDetail" class="secondary small">← 一覧へ</button><div id="detail"></div></section></main><script>
(()=>{'use strict';const KEY='myrecipe_v1';let recipes=[],filter='all',current=null,editId=null,photoData='';const el=id=>document.getElementById(id);function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');recipes=Array.isArray(data)?data:[]}catch{recipes=[]}}function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));recipes=next;return true}catch(e){alert('保存できませんでした。端末の空き容量やブラウザの保存制限をご確認ください。写真を小さくする方法も有効です。');return false}}function show(screen){for(const x of document.querySelectorAll('.screen'))x.classList.toggle('active',x.id===screen+'Screen');el('search').style.display=screen==='list'?'block':'none';el('newTop').style.display=screen==='list'?'block':'none';window.scrollTo(0,0)}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=el('search').value.trim().toLocaleLowerCase();const arr=recipes.filter(r=>(filter==='all'||r.favorite)&&(!q||(r.name+' '+r.ingredients.map(i=>i.name).join(' ')+' '+r.steps+' '+(r.memo||'')).toLocaleLowerCase().includes(q))).sort((a,b)=>b.updated-a.updated);el('count').textContent=`${arr.length} 件のレシピ`;el('cards').innerHTML=arr.map(r=>`<button class="tile" data-id="${escapeHtml(r.id)}">${r.photo?`<img src="${r.photo}" alt="${escapeHtml(r.name)}">`:'<div class="placeholder">🍽️</div>'}<div class="body"><div class="name">${r.favorite?'★ ':''}${escapeHtml(r.name)}</div><div class="tags">${escapeHtml(r.ingredients.map(x=>x.name).filter(Boolean).slice(0,3).join('・'))}</div></div></button>`).join('');el('empty').hidden=arr.length>0;for(const b of document.querySelectorAll('.tile'))b.addEventListener('click',()=>openDetail(b.dataset.id));}function addRow(name='',qty=''){const row=document.createElement('div');row.className='ingredient';row.innerHTML=`<input type="text" class="ingName" placeholder="材料名" aria-label="材料名" value="${escapeHtml(name)}"><input type="text" class="ingQty" placeholder="分量" aria-label="分量" value="${escapeHtml(qty)}"><button type="button" aria-label="材料を削除">×</button>`;row.querySelector('button').onclick=()=>row.remove();el('ingredients').appendChild(row)}function openEdit(id=null){editId=id;const r=recipes.find(x=>x.id===id);el('formTitle').textContent=r?'レシピを編集':'レシピを追加';el('name').value=r?.name||'';el('steps').value=r?.steps||'';el('memo').value=r?.memo||'';photoData=r?.photo||'';el('photo').value='';setPreview();el('ingredients').innerHTML='';for(const i of r?.ingredients?.length?r.ingredients:[{name:'',qty:''}])addRow(i.name,i.qty);show('edit')}function setPreview(){el('preview').hidden=!photoData;el('removePhoto').hidden=!photoData;if(photoData)el('preview').src=photoData;else el('preview').removeAttribute('src')}function openDetail(id){const r=recipes.find(x=>x.id===id);if(!r){show('list');return}current=id;el('detail').innerHTML=`<div class="actions"><button id="editDetail" class="secondary small">✎ 編集</button><button id="favDetail" class="star" aria-label="お気に入りを切り替える">${r.favorite?'★':'☆'}</button><button id="deleteDetail" class="danger small">削除</button></div>${r.photo?`<img class="detail-photo" src="${r.photo}" alt="${escapeHtml(r.name)}">`:''}<h2 class="title2">${escapeHtml(r.name)}</h2><div class="panel"><h3>材料</h3>${r.ingredients.length?r.ingredients.map(i=>`<div class="line">${escapeHtml(i.name)} <strong style="float:right">${escapeHtml(i.qty)}</strong></div>`).join(''):'<span class="muted">未入力</span>'}</div><div class="panel"><h3>作り方</h3><div class="steps">${escapeHtml(r.steps)||'未入力'}</div></div>${r.memo?`<div class="panel"><h3>メモ</h3><div class="steps">${escapeHtml(r.memo)}</div></div>`:''}`;el('editDetail').onclick=()=>openEdit(id);el('favDetail').onclick=()=>{const next=recipes.map(x=>x.id===id?{...x,favorite:!x.favorite,updated:Date.now()}:x);if(persist(next))openDetail(id)};el('deleteDetail').onclick=()=>{if(confirm('このレシピを削除しますか？')){if(persist(recipes.filter(x=>x.id!==id))){render();show('list')}}};show('detail')}
function resizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const scale=Math.min(1,1100/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};image.src=reader.result};reader.readAsDataURL(file)})}
el('newTop').onclick=()=>openEdit();el('backEdit').onclick=el('cancel').onclick=()=>{render();show('list')};el('backDetail').onclick=()=>{render();show('list')};el('addIngredient').onclick=()=>addRow();el('removePhoto').onclick=()=>{photoData='';setPreview()};el('photo').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{photoData=await resizeImage(f);setPreview()}catch{alert('写真を読み込めませんでした。別の写真を選択してください。')}};el('recipeForm').onsubmit=e=>{e.preventDefault();const name=el('name').value.trim();if(!name)return;const ingredients=[...el('ingredients').children].map(row=>({name:row.querySelector('.ingName').value.trim(),qty:row.querySelector('.ingQty').value.trim()})).filter(x=>x.name);const old=recipes.find(x=>x.id===editId);const r={id:editId||('r'+Date.now()+Math.random().toString(36).slice(2)),name,ingredients,steps:el('steps').value.trim(),memo:el('memo').value.trim(),photo:photoData,favorite:old?.favorite||false,updated:Date.now()};if(persist(editId?recipes.map(x=>x.id===editId?r:x):[r,...recipes])){render();openDetail(r.id)}};el('search').oninput=render;el('allBtn').onclick=()=>{filter='all';render()};el('favBtn').onclick=()=>{filter='fav';render()};el('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'My Recipe',version:1,exportedAt:new Date().toISOString(),recipes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-recipe-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el('importBtn').onclick=()=>el('importFile').click();el('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='My Recipe'||!Array.isArray(data.recipes)||!data.recipes.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Array.isArray(x.ingredients)&&typeof x.steps==='string'))throw Error('invalid');if(!confirm('現在のレシピをバックアップファイルの内容で置き換えます。よろしいですか？'))return;const cleaned=data.recipes.map(x=>({id:x.id,name:x.name,ingredients:x.ingredients.map(i=>({name:String(i.name||''),qty:String(i.qty||'')})),steps:x.steps,memo:String(x.memo||''),photo:typeof x.photo==='string'&&x.photo.startsWith('data:image/')?x.photo:'',favorite:!!x.favorite,updated:Number(x.updated)||Date.now()}));if(persist(cleaned)){render();alert('復元しました')}}catch{alert('このファイルはMy Recipeのバックアップとして読み込めませんでした。')}finally{e.target.value=''}};load();render();})();
</script></body></html>
