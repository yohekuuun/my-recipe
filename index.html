<!doctype html><html lang="ja"><head><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon.png"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf4"><title>My Recipe Ver.2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#292821;background:#fffaf4}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#fffaf4ee;backdrop-filter:blur(12px);padding:22px 18px 12px;z-index:5;border-bottom:1px solid #eee4d7}.wrap{max-width:760px;margin:auto}h1{font-size:27px;margin:0 0 5px}small,.muted{color:#81796f}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.button,button{border:0;border-radius:13px;background:#a44830;color:white;font-weight:700;padding:11px 16px;font-size:15px;cursor:pointer}.secondary{background:#eee6db;color:#483c34}.danger{background:#a32c31}.small{font-size:13px;padding:8px 11px}.search{width:100%;border:1px solid #dfd2c3;background:white;padding:14px;border-radius:14px;font-size:16px;margin-top:16px}main{padding:18px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.tile{border:1px solid #eee1d5;border-radius:17px;overflow:hidden;background:white;cursor:pointer;text-align:left;color:#302a25;padding:0}.tile img,.placeholder{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f0e3d3;display:grid;place-items:center;font-size:35px}.tile .body{padding:11px}.tile .name{font-size:16px;font-weight:750;line-height:1.45}.tile .tags{color:#8b786b;font-size:12px;margin-top:5px;line-height:1.4}.empty{text-align:center;padding:65px 12px;color:#75675c}.screen{display:none}.screen.active{display:block}label{font-size:14px;font-weight:700;display:block;margin:15px 0 6px}input[type=text],input[type=number],textarea{width:100%;font:inherit;padding:12px;border:1px solid #d9cbbd;border-radius:12px;background:white;font-size:16px}textarea{min-height:85px;resize:vertical}.ingredient{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 40px;gap:7px;margin:8px 0}.ingredient button{padding:4px;background:#eee6db;color:#7b5041}.panel{background:white;border:1px solid #efe1d3;border-radius:16px;padding:16px;margin:14px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}.preview{max-width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-top:10px}.detail-photo{width:100%;max-height:350px;object-fit:cover;border-radius:16px}.steps{white-space:pre-wrap;line-height:1.8}.line{padding:9px 0;border-bottom:1px solid #f2e9df}.line:last-child{border-bottom:0}.title2{font-size:26px;margin:15px 0 4px}.hint{font-size:12px;color:#8c7e72;line-height:1.6}.footer{margin:25px 0 60px;color:#988b7b;font-size:12px}.star{font-size:22px;background:transparent;color:#ab6640;padding:4px 8px}input[type=file]{width:100%;font-size:14px}.notice{font-size:13px;background:#f4e8d7;border-radius:10px;padding:11px;line-height:1.6}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c68569} .category-list{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.cat-chip{padding:9px 12px;border-radius:999px;background:#f1e8dd;color:#493b32;font-size:13px;font-weight:600;border:1px solid #e7d8c8}.cat-chip.selected{background:#a44830;color:white;border-color:#a44830}.cat-chip:focus-visible{outline:3px solid #c68569}.category-label{color:#76665a;font-size:13px;margin:8px 0}.servings-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.servings-row input{max-width:112px}.serve-control{display:flex;align-items:center;gap:10px}.serve-control button{width:40px;height:40px;padding:0;font-size:22px}.serve-num{font-weight:700;min-width:66px;text-align:center}.category-tile{font-size:12px;color:#a44830;font-weight:650;margin-top:6px;line-height:1.5}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h3{margin:0}.tag-pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tag-pill{font-size:12px;background:#f1e8dd;color:#644b37;border-radius:999px;padding:5px 9px}.field-help{font-size:12px;color:#81796f;line-height:1.5;margin:5px 0 8px}.notice strong{color:#6f3b2e} </style></head><body>
<header><div class="wrap"><div class="top"><div><h1>🍳 My Recipe</h1><small>お気に入りの味を、いつでも。 · Ver.2</small></div><button id="newTop">＋ 追加</button></div><input id="search" class="search" placeholder="🔎 料理名・材料名から探す" aria-label="レシピを検索"></div></header>
<main class="wrap"><section id="listScreen" class="screen active"><div class="tools"><button id="allBtn" class="secondary small">すべて</button><button id="favBtn" class="secondary small">★ お気に入り</button><button id="exportBtn" class="secondary small">↓ バックアップ</button><button id="importBtn" class="secondary small">↑ 復元</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><div class="panel"><div class="section-head"><strong>カテゴリで絞り込む</strong><button type="button" id="clearCats" class="secondary small">解除</button></div><div id="filterCategories" class="category-list"></div></div><p id="count" class="muted"></p><div id="cards" class="grid"></div><div id="empty" class="empty" hidden>まだレシピがありません。<br>右上の「＋ 追加」で登録してみよう！</div><div class="footer">※ レシピ・写真・カテゴリは、このブラウザ内に保存されます。定期的にバックアップしてください。端末間の自動同期はありません。</div></section>
<section id="editScreen" class="screen"><button id="backEdit" class="secondary small">← 戻る</button><h2 id="formTitle">レシピを追加</h2><form id="recipeForm"><label for="name">料理名 *</label><input type="text" id="name" required placeholder="例：鶏の照り焼き"><label for="photo">完成写真</label><input type="file" id="photo" accept="image/*"><img id="preview" class="preview" alt="写真プレビュー" hidden><div class="actions"><button type="button" id="removePhoto" class="secondary small" hidden>写真を削除</button></div><label for="baseServings">基準の人数</label><div class="servings-row"><input type="number" id="baseServings" min="1" max="100" step="1" inputmode="numeric" value="2" required><span>人分</span></div><p id="baseNote" class="field-help">材料はこの人数分の分量で入力してください。</p><label>カテゴリ（複数選択できます）</label><div id="editCategories" class="category-list"></div><label>材料・分量</label><div id="ingredients"></div><button type="button" id="addIngredient" class="secondary small">＋ 材料を追加</button><label for="steps">調理方法</label><textarea id="steps" placeholder="1. 材料を切る&#10;2. フライパンで焼く&#10;3. 味付けをする"></textarea><label for="memo">メモ（任意）</label><textarea id="memo" placeholder="コツ、調理時間、人数など"></textarea><div class="actions"><button type="submit" id="saveBtn">保存する</button><button type="button" id="cancel" class="secondary">キャンセル</button></div></form><p class="hint">写真は保存容量を抑えるため自動縮小します。保存できない場合は写真を減らすか、バックアップしてください。</p></section>
<section id="detailScreen" class="screen"><button id="backDetail" class="secondary small">← 一覧へ</button><div id="detail"></div></section></main><script>
(()=>{'use strict';
const KEY='myrecipe_v1';
const CATEGORIES=['肉料理','魚料理','野菜料理','ご飯もの','麺類','汁物','副菜','デザート','パン','その他'];
let recipes=[],filter='all',categoryFilter=[],current=null,editId=null,photoData='',chosenCategories=[];
const el=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baseOf=r=>(Number.isInteger(Number(r.servings))&&Number(r.servings)>0&&Number(r.servings)<=100)?Number(r.servings):2;
const catsOf=r=>Array.isArray(r.categories)?[...new Set(r.categories.filter(x=>CATEGORIES.includes(x)))]:[];
function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');recipes=Array.isArray(data)?data:[]}catch(e){recipes=[];alert('レシピを読み込めませんでした。バックアップがあれば復元してください。')}}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));recipes=next;return true}catch(e){alert('保存できませんでした。ブラウザの保存容量をご確認ください。写真の枚数やサイズを減らすと改善する場合があります。');return false}}
function show(screen){for(const x of document.querySelectorAll('.screen'))x.classList.toggle('active',x.id===screen+'Screen');el('search').style.display=screen==='list'?'block':'none';el('newTop').style.display=screen==='list'?'block':'none';window.scrollTo(0,0)}
function renderCategoryFilter(){el('filterCategories').innerHTML=['未分類',...CATEGORIES].map(c=>`<button type="button" class="cat-chip ${categoryFilter.includes(c)?'selected':''}" data-category="${escapeHtml(c)}" aria-pressed="${categoryFilter.includes(c)}">${escapeHtml(c)}</button>`).join('');for(const b of el('filterCategories').querySelectorAll('button'))b.onclick=()=>{const c=b.dataset.category;categoryFilter=categoryFilter.includes(c)?categoryFilter.filter(x=>x!==c):[...categoryFilter,c];render()}}
function render(){renderCategoryFilter();const q=el('search').value.trim().toLocaleLowerCase();const arr=recipes.filter(r=>{const cs=catsOf(r);const matchCategory=!categoryFilter.length||categoryFilter.some(c=>c==='未分類'?!cs.length:cs.includes(c));const matchSearch=!q||(r.name+' '+(r.ingredients||[]).map(i=>i.name).join(' ')+' '+(r.steps||'')+' '+(r.memo||'')+' '+cs.join(' ')).toLocaleLowerCase().includes(q);return (filter==='all'||r.favorite)&&matchCategory&&matchSearch}).sort((a,b)=>(Number(b.updated)||0)-(Number(a.updated)||0));el('count').textContent=`${arr.length} 件のレシピ`;el('cards').innerHTML=arr.map(r=>`<button class="tile" data-id="${escapeHtml(r.id)}">${r.photo?`<img src="${escapeHtml(r.photo)}" alt="${escapeHtml(r.name)}">`:'<div class="placeholder">🍽️</div>'}<div class="body"><div class="name">${r.favorite?'★ ':''}${escapeHtml(r.name)}</div><div class="category-tile">${escapeHtml(catsOf(r).join('・')||'未分類')}</div><div class="tags">${escapeHtml((r.ingredients||[]).map(x=>x.name).filter(Boolean).slice(0,3).join('・'))}</div></div></button>`).join('');el('empty').hidden=arr.length>0;for(const b of document.querySelectorAll('.tile'))b.onclick=()=>openDetail(b.dataset.id)}
function renderEditCategories(){el('editCategories').innerHTML=CATEGORIES.map(c=>`<button type="button" class="cat-chip ${chosenCategories.includes(c)?'selected':''}" data-category="${escapeHtml(c)}" aria-pressed="${chosenCategories.includes(c)}">${escapeHtml(c)}</button>`).join('');for(const b of el('editCategories').querySelectorAll('button'))b.onclick=()=>{const c=b.dataset.category;chosenCategories=chosenCategories.includes(c)?chosenCategories.filter(x=>x!==c):[...chosenCategories,c];renderEditCategories()}}
function addRow(name='',qty=''){const row=document.createElement('div');row.className='ingredient';row.innerHTML=`<input type="text" class="ingName" placeholder="材料名" aria-label="材料名" value="${escapeHtml(name)}"><input type="text" class="ingQty" placeholder="分量" aria-label="分量" value="${escapeHtml(qty)}"><button type="button" aria-label="材料を削除">×</button>`;row.querySelector('button').onclick=()=>row.remove();el('ingredients').appendChild(row)}
function setPreview(){el('preview').hidden=!photoData;el('removePhoto').hidden=!photoData;if(photoData)el('preview').src=photoData;else el('preview').removeAttribute('src')}
function openEdit(id=null){editId=id;const r=recipes.find(x=>x.id===id);el('formTitle').textContent=r?'レシピを編集':'レシピを追加';el('name').value=r?.name||'';el('steps').value=r?.steps||'';el('memo').value=r?.memo||'';el('baseServings').value=r?baseOf(r):2;el('baseNote').textContent=r&&r.servings==null?'以前のレシピです。基準人数が未登録のため仮に2人分としています。実際の人数に直して保存してください。':'材料はこの人数分の分量で入力してください。';chosenCategories=r?catsOf(r):[];renderEditCategories();photoData=r?.photo||'';el('photo').value='';setPreview();el('ingredients').innerHTML='';for(const i of r?.ingredients?.length?r.ingredients:[{name:'',qty:''}])addRow(i.name,i.qty);show('edit')}
// Parse only an unambiguous leading numeric quantity. Keep "適量", "少々", ranges and textual quantities unchanged.
function parseQty(str){const original=String(str||'').trim();if(!original)return null;const s=original.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296)).replace(/．/g,'.').replace(/／/g,'/').replace(/，/g,',').replace(/½/g,'1/2').replace(/¼/g,'1/4').replace(/¾/g,'3/4');let prefix='',amount=null,suffix='';const measurement=s.match(/^(大さじ|小さじ|カップ|お玉)\s*/);let rest=s;if(measurement){prefix=measurement[1];rest=s.slice(measurement[0].length)}const number=rest.match(/^(\d+(?:\.\d+)?)(?:\s*(?:と|\+)\s*(\d+)\s*\/\s*(\d+)|\s*\/\s*(\d+))?/);if(!number)return null;amount=Number(number[1]);if(number[2]){if(+number[3]===0)return null;amount+=Number(number[2])/Number(number[3])}else if(number[4]){if(+number[4]===0)return null;amount=Number(number[1])/Number(number[4])}suffix=rest.slice(number[0].length);if(/^\s*(?:[〜～~\-－–—]|から|または|～|〜|\/)/.test(suffix))return null;if(!Number.isFinite(amount)||amount<=0)return null;return {amount,prefix,suffix}}
function pretty(n){const v=Math.round((n+Number.EPSILON)*1000)/1000;const whole=Math.floor(v);const frac=v-whole;const fractions=[[.125,'1/8'],[.25,'1/4'],[.333333,'1/3'],[.375,'3/8'],[.5,'1/2'],[.625,'5/8'],[.666667,'2/3'],[.75,'3/4'],[.875,'7/8']];for(const [f,t] of fractions)if(Math.abs(frac-f)<.005)return whole?`${whole}と${t}`:t;return String(v)}
function scaledQty(qty,ratio){if(ratio===1)return String(qty||'');const p=parseQty(qty);if(!p)return String(qty||'');return `${p.prefix}${pretty(p.amount*ratio)}${p.suffix}`}
function quantityMarkup(r,n){const ratio=n/baseOf(r);return (r.ingredients||[]).length?r.ingredients.map(i=>`<div class="line"><span>${escapeHtml(i.name)}</span> <strong style="float:right;margin-left:10px">${escapeHtml(scaledQty(i.qty,ratio))}</strong></div>`).join(''):'<span class="muted">未入力</span>'}
function openDetail(id){const r=recipes.find(x=>x.id===id);if(!r){render();show('list');return}current=id;let viewing=baseOf(r);const cs=catsOf(r);el('detail').innerHTML=`<div class="actions"><button id="editDetail" class="secondary small">✎ 編集</button><button id="favDetail" class="star" aria-label="お気に入りを切り替える">${r.favorite?'★':'☆'}</button><button id="deleteDetail" class="danger small">削除</button></div>${r.photo?`<img class="detail-photo" src="${escapeHtml(r.photo)}" alt="${escapeHtml(r.name)}">`:''}<h2 class="title2">${escapeHtml(r.name)}</h2><div class="tag-pills">${(cs.length?cs:['未分類']).map(c=>`<span class="tag-pill">${escapeHtml(c)}</span>`).join('')}</div><div class="panel"><div class="section-head"><h3>材料</h3><div class="serve-control"><button id="minusServing" class="secondary" aria-label="人数を減らす">－</button><span id="servingCount" class="serve-num"></span><button id="plusServing" class="secondary" aria-label="人数を増やす">＋</button></div></div><div class="field-help">基準：${baseOf(r)}人分${r.servings==null?'（以前のレシピ：仮設定。編集で確認してください）':''}</div><div id="quantities"></div></div><div class="panel"><h3>作り方</h3><div class="steps">${escapeHtml(r.steps)||'未入力'}</div></div>${r.memo?`<div class="panel"><h3>メモ</h3><div class="steps">${escapeHtml(r.memo)}</div></div>`:''}`;function updateView(){el('servingCount').textContent=`${viewing}人分`;el('quantities').innerHTML=quantityMarkup(r,viewing);el('minusServing').disabled=viewing<=1;el('plusServing').disabled=viewing>=100}el('minusServing').onclick=()=>{viewing=Math.max(1,viewing-1);updateView()};el('plusServing').onclick=()=>{viewing=Math.min(100,viewing+1);updateView()};updateView();el('editDetail').onclick=()=>openEdit(id);el('favDetail').onclick=()=>{const next=recipes.map(x=>x.id===id?{...x,favorite:!x.favorite,updated:Date.now()}:x);if(persist(next))openDetail(id)};el('deleteDetail').onclick=()=>{if(confirm('このレシピを削除しますか？')){if(persist(recipes.filter(x=>x.id!==id))){render();show('list')}}};show('detail')}
function resizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=reject;image.onload=()=>{const scale=Math.min(1,1100/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};image.src=reader.result};reader.readAsDataURL(file)})}
el('newTop').onclick=()=>openEdit();el('backEdit').onclick=el('cancel').onclick=()=>{render();show('list')};el('backDetail').onclick=()=>{render();show('list')};el('addIngredient').onclick=()=>addRow();el('removePhoto').onclick=()=>{photoData='';setPreview()};el('photo').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{photoData=await resizeImage(f);setPreview()}catch{alert('写真を読み込めませんでした。別の写真を選択してください。')}};
el('recipeForm').onsubmit=e=>{e.preventDefault();const name=el('name').value.trim();const base=Number(el('baseServings').value);if(!name)return;if(!Number.isInteger(base)||base<1||base>100){alert('基準人数は1〜100の整数で入力してください。');return}const ingredients=[...el('ingredients').children].map(row=>({name:row.querySelector('.ingName').value.trim(),qty:row.querySelector('.ingQty').value.trim()})).filter(x=>x.name);const old=recipes.find(x=>x.id===editId);const r={...old,id:editId||('r'+Date.now()+Math.random().toString(36).slice(2)),name,ingredients,steps:el('steps').value.trim(),memo:el('memo').value.trim(),photo:photoData,favorite:old?.favorite||false,updated:Date.now(),servings:base,categories:[...chosenCategories]};if(persist(editId?recipes.map(x=>x.id===editId?r:x):[r,...recipes])){render();openDetail(r.id)}};
el('search').oninput=render;el('allBtn').onclick=()=>{filter='all';render()};el('favBtn').onclick=()=>{filter='fav';render()};el('clearCats').onclick=()=>{categoryFilter=[];render()};
el('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'My Recipe',version:2,exportedAt:new Date().toISOString(),recipes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-recipe-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
el('importBtn').onclick=()=>el('importFile').click();el('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='My Recipe'||!Array.isArray(data.recipes)||!data.recipes.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Array.isArray(x.ingredients)&&typeof x.steps==='string'))throw Error('invalid');if(!confirm('現在のレシピをバックアップファイルの内容で置き換えます。よろしいですか？'))return;const cleaned=data.recipes.map(x=>({...x,id:x.id,name:x.name,ingredients:x.ingredients.map(i=>({name:String(i.name||''),qty:String(i.qty||'')})),steps:x.steps,memo:String(x.memo||''),photo:typeof x.photo==='string'&&x.photo.startsWith('data:image/')?x.photo:'',favorite:!!x.favorite,updated:Number(x.updated)||Date.now(),servings:baseOf(x),categories:catsOf(x)}));if(persist(cleaned)){categoryFilter=[];filter='all';el('search').value='';render();show('list');alert('復元しました')}}catch{alert('このファイルはMy Recipeのバックアップとして読み込めませんでした。')}finally{e.target.value=''}};
load();render();
})();
</script></body></html>
